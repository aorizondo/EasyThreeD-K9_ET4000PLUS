#
# Marlin/config.ini  ---  Overrides del K9 (aorizondo)
#
# El script de build (buildroot/.../configuration.py) aplica estas
# opciones ENCIMA de config/EasyThreeD/ET4000PLUS/Configuration.h.
# Aqui van SOLO los cambios respecto a esa base; el resto de ajustes
# se hacen en caliente por G-code + M500, sin reflashear.
#
#   ini_use_config = base   -> aplica SOLO la seccion [config:base].
#
# IMPORTANTE: NO poner 'all'. Este fichero traia plantillas de ejemplo
# de Marlin (RAMPS, cama 200x200, etc.) que con 'all' machacarian la
# config del K9. Por eso se dejaron fuera y solo usamos [config:base].
#
[config:base]
ini_use_config                = base

# --- Sonda Z: homing de Z + nivelacion automatica (UBL) ---
use_probe_for_z_homing        = on      # Z hace homing con la sonda (no por choque)
z_safe_homing                 = on      # G28: posiciona XY y baja Z a sondear en el centro
z_min_probe_endstop_inverting = false   # VERIFICADO EN VIVO: sin contacto=LOW=open, contacto=HIGH=triggered (al reves de lo estimado)
nozzle_to_probe_offset        = { -10, 25, -2 }   # ESTIMADO (brazo basculante eje X, deploy manual); calibrar Z real con M851 + M500
# Sonda de baja calidad: promediar varios sondeos por punto y descartar outliers.
multiple_probing              = 2       # 2 sondeos validos por punto, promediados
extra_probing                 = 1       # 1 sondeo extra que se descarta (el mas atipico) -> 3 totales

# --- Crash homing de X/Y sin endstops (a tope fisico) ---
validate_homing_endstops      = off     # no matar si el endstop nunca dispara: deja chocar a tope
home_z_first                  = off     # incompatible con sonda Z (era para endstop real)

# --- Compatibilidad con Z_SAFE_HOMING / sin endstops ---
# DISABLE_[XYZ] (apagar motor en idle) choca con Z_SAFE_HOMING, y ademas sin
# endstops no queremos perder posicion tras el homing -> motores siempre activos.
disable_x                     = off
disable_y                     = off
disable_z                     = off

# --- Velocidad de homing (SEGURIDAD para crash homing) ---
# Compile-time (no hay G-code para ajustarlo en caliente). X/Y chocan a tope:
# velocidad baja = impacto suave. Z baja con la sonda: lento = preciso.
homing_feedrate_mm_m          = { (30*60), (30*60), (6*60) }   # 30mm/s X/Y, 6mm/s Z

# --- Input shaping (anti-ghosting): tunear con M593 + M500 en caliente ---
# Sin cap, DEFAULT_MAX_FEEDRATE=6000mm/s x 606 steps = 3.6M steps/s revienta
# el array de shaping (overflow / no cabe en SRAM). 30000 steps/s ~= 50mm/s.
shaping_max_steprate          = 30000
# El buffer se dimensiona en compilacion con SHAPING_MIN_FREQ. 20Hz da margen
# para bajar la frecuencia por M593 al afinar (buffer ~753 entradas, ~3.7KB SRAM).
shaping_min_freq              = 20

# --- Sensor de filamento (ira un sensor fotosensible) ---
filament_runout_sensor        = on      # activo
fil_runout_state              = HIGH    # logica invertida (antes LOW)

# --- Limpieza ---
marlin_dev_mode               = off     # quitar modo desarrollo del firmware de produccion
# ASSISTED_TRAMMING off: con el offset de sonda Y+25 los puntos de tramming
# quedan fuera de alcance, y con UBL no hace falta nivelar tornillos a mano.
assisted_tramming             = off
